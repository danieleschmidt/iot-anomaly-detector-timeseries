[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iot_anomaly_detector"
version = "1.0.0"
requires-python = ">=3.8"
description = "Real-time IoT time-series anomaly detection: statistical + LSTM autoencoder"
license = {text = "MIT"}
readme = "README.md"
keywords = ["anomaly-detection", "iot", "time-series", "lstm", "autoencoder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "numpy>=2.0.2",
    "scipy>=1.7",
    "torch>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["iot_anomaly_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
